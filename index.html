<style>
  :root { --ink:#080808; --char:#121110; --gold:#C9A24B; --gold-soft:#E7CF95; --paper:#F5F1E8; --line:rgba(201,162,75,.26); --mute:#9a9388; --ease:cubic-bezier(.2,.7,.1,1); }

  @keyframes pulse { 50% { transform:scale(1.25); opacity:.5; } }

  .chip { display:inline-flex; align-items:center; gap:9px; height:40px; padding:0 16px; border:1px solid var(--line); background:rgba(8,8,8,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:#d9d2c4; font:inherit; font-size:13.5px; cursor:pointer; transition:all .35s var(--ease); }
  .chip i { width:14px; height:14px; border-radius:50%; border:1px solid rgba(255,255,255,.25); }

  .scrolldown::after { content:""; position:absolute; top:-50%; left:0; width:1px; height:50%; background:#fff; animation:drop 2s infinite var(--ease); }
  @keyframes drop { to { top:110%; } }

  /* marquee */
  .marq { border-block:1px solid var(--line); overflow:hidden; padding:18px 0; background:#0b0a09; direction:ltr; }
  .marq div { display:flex; gap:56px; width:max-content; animation:slide 38s linear infinite; }
  .marq span { font-family:'Cormorant Garamond',serif; font-size:26px; font-style:italic; color:transparent; -webkit-text-stroke:1px rgba(201,162,75,.6); white-space:nowrap; }
  .marq span:nth-child(even) { color:var(--gold); -webkit-text-stroke:0; font-size:14px; align-self:center; }

  section { padding:112px 0; position:relative; }
  section.light { background:var(--paper); color:#1a1917; }
  .kicker { color:var(--gold); letter-spacing:.3em; font-size:12px; text-transform:uppercase; margin-bottom:16px; }

  h2 { font-size:clamp(32px,4.6vw,56px); font-weight:500; line-height:1.12; margin-bottom:16px; }
  [dir="rtl"] h2 { font-family:'Tajawal',sans-serif; font-weight:700; line-height:1.35; font-size:clamp(28px,4vw,46px); }
  .sub { max-width:58ch; color:var(--mute); font-size:17px; margin-bottom:56px; }
  .light .sub { color:#6a6459; }

  /* service cards with 3D tilt */
  .svc { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; perspective:1400px; }
  .card { position:relative; background:#fff; padding:40px 32px 36px; border:1px solid rgba(26,25,23,.1); transform-style:preserve-3d; transition:transform .5s var(--ease), box-shadow .5s; will-change:transform; overflow:hidden; }
  .card::before { content:""; position:absolute; inset:0; background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%), rgba(201,162,75,.2), transparent 55%); opacity:0; transition:opacity .4s; }
  .card::after { content:""; position:absolute; inset-inline-start:0; top:0; height:2px; width:0; background:var(--gold); transition:width .6s var(--ease); }

  .card > * { position:relative; transform:translateZ(28px); }

  .card li::before { content:""; width:5px; height:5px; background:var(--gold); transform:rotate(45deg); flex:none; }

  .flow { position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:30px; padding-top:40px; }
  .flow .rail { position:absolute; top:11px; left:0; right:0; height:1px; background:var(--line); }
  .flow .rail i { display:block; height:100%; width:0; background:var(--gold); transition:width 1.6s var(--ease); margin-inline-start:0; }
  .flow.in .rail i { width:100%; }
  .flow .st { position:relative; }
  .flow .st::before { content:""; position:absolute; top:-35px; inset-inline-start:0; width:13px; height:13px; border:1px solid var(--gold); background:var(--ink); transform:rotate(45deg); transition:background .5s; }
  .flow.in .st::before { background:var(--gold); }
  .flow .n { font-family:'Cormorant Garamond',serif; color:var(--gold); font-size:30px; direction:ltr; display:block; margin-bottom:8px; }
  .flow h3 { font-size:19px; font-weight:500; color:#fff; margin-bottom:6px; }

  /* statement */
  .state { text-align:center; padding:120px 0; background:linear-gradient(180deg,#0f0e0d,#080808); border-block:1px solid var(--line); }
  .state p { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(28px,4.4vw,56px); line-height:1.25; max-width:22ch; margin:0 auto; color:#fff; }

  .pitch li::before { content:""; width:6px; height:6px; background:var(--gold); transform:rotate(45deg); flex:none; }
  .picked { margin-top:26px; padding:16px 18px; border:1px solid rgba(154,122,44,.4); background:rgba(201,162,75,.1); font-size:14.5px; display:none; }
  .picked b { font-weight:500; }
  form { background:#0d0c0b; color:#ECE6D9; padding:38px; border:1px solid var(--line); position:relative; box-shadow:0 50px 90px -50px rgba(0,0,0,.7); }
  form::before { content:""; position:absolute; top:-1px; inset-inline-start:-1px; width:64px; height:64px; border-top:2px solid var(--gold); border-inline-start:2px solid var(--gold); pointer-events:none; }
  form::after { content:""; position:absolute; bottom:-1px; inset-inline-end:-1px; width:64px; height:64px; border-bottom:2px solid var(--gold); border-inline-end:2px solid var(--gold); pointer-events:none; }
  .f2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  label { display:block; font-size:12.5px; color:#a89f90; margin:16px 0 6px; letter-spacing:.04em; }
  input, select, textarea { width:100%; height:48px; padding:0 2px; border:0; border-bottom:1px solid rgba(236,230,217,.25); background:transparent; font:inherit; font-size:16px; color:#fff; border-radius:0; transition:border-color .3s; }
  select option { color:#111; }
  textarea { height:84px; padding:10px 2px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--gold); }

  .hp { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); opacity:0; pointer-events:none; }
  form .cta { width:100%; margin-top:28px; height:54px; }

  footer { border-top:1px solid var(--line); padding:40px 0; color:var(--mute); font-size:13.5px; }

    .flow .rail i { width:100% !important; height:0; transition:height 1.6s var(--ease); } .flow.in .rail i { height:100%; }
    .flow .st::before { top:8px; inset-inline-start:-30px; }

  }

<body>
<div id="intro"><div class="im"><b>BEZALEL</b><i>STUDIO</i><s></s></div></div>
<div id="bar"></div><div id="glow"></div>

<header class="top" id="hdr"><div class="wrap">
  <a class="mark" href="#top" aria-label="BEZALEL STUDIO"><b>BEZALEL</b><i>STUDIO</i></a>
  <nav>
    <button class="lang" id="langBtn" type="button">EN</button>
    <a class="cta sm" href="#contact" data-t="navCta"></a>
  </nav>
</div></header>

<main id="top">
  <div class="hero"><div class="wrap">
    <div>
      <div class="eyebrow" data-t="heroEyebrow"></div>

    <div class="svc" id="svcGrid"></div>
  </div></section>

  <section id="process"><div class="wrap">
    <div class="kicker rv" data-t="stepKick"></div>

    </div>
  </div></section>

  <div class="state"><div class="wrap"><p class="rv" id="stateLine"></p></div></div>

  <section class="light" id="contact"><div class="wrap contact">

      <div class="kicker" data-t="formKick"></div>
      <h2 class="serif" data-t="formTitle"></h2>
      <p data-t="formSub"></p>
      <ul id="pitchList"></ul>
      <div class="picked" id="picked"></div>
    </div>
    <form id="leadForm" class="rv" novalidate>
      <div id="formBody">

$('leadForm').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var t = T[lang], err = $('fErr'), btn = $('fSend');
  var name = $('fName').value.trim(), phone = $('fPhone').value.replace(/[^\d+]/g, '');
  err.textContent = '';
  if (name.length < 2) { err.textContent = t.errName; $('fName').focus(); return; }
  if (phone.replace(/\D/g, '').length < 10) { err.textContent = t.errPhone; $('fPhone').focus(); return; }
  var msg = $('fMsg').value.trim();
  if (stylePicked) msg = (msg ? msg + ' | ' : '') + 'Preferred style: ' + T.en.styles[styleKey];
  var data = { name: name, phone: phone, service: $('fService').value, location: $('fLocation').value,
               property_type: $('fProperty').value, area: $('fArea').value, message: msg, website: $('fWeb').value };
  Object.keys(BOOT.utm || {}).forEach(function (k) { data[k] = BOOT.utm[k]; });
  btn.disabled = true; btn.textContent = t.sending;
  function fail(m) { err.textContent = m || t.errSend; btn.disabled = false; btn.textContent = t.fSend; }
  data.site_key = SITE_KEY;
  data.landing_page = (location.origin + location.pathname).slice(0, 200);
  // text/plain body = no CORS preflight; Apps Script answers through a redirect that allows any origin.
  fetch(EXEC_URL, { method: 'POST', body: JSON.stringify(data) })
    .then(function (res) { return res.json(); })
    .then(function (r) {
      if (r && r.ok) {
        $('formBody').innerHTML = '<div class="done"><div class="tick">✓</div><h3>' + esc(t.doneTitle) + '</h3><p>' + esc(t.doneBody) + '</p></div>';
      } else { fail(r && r.code === 'VALIDATION' ? t.errPhone : t.errSend); }
    })
    .catch(function () { fail(); });
});

(function refreshLists() {
  fetch(EXEC_URL + '?p=lists').then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.ok || !d.lists) return;
    BOOT.lists = d.lists;
    fillSelect('fService', d.lists.service); fillSelect('fLocation', d.lists.location); fillSelect('fProperty', d.lists.property);
    var areas = (d.lists.location || []).map(function (o) { return lang === 'ar' ? o.ar : o.v; });
    if (areas.length) $('areaList').innerHTML = areas.slice(0, 14).map(function (a) { return '<span>' + esc(a) + '</span>'; }).join('');
  }).catch(function () {});
})();
